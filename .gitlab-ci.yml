workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == 'master'

variables:
  DEPLOY_DIR: "/var/www/repo"

cache:
    key: "$CI_BUILD_STAGE"
    paths:
      - .m2
    
stages:
  - build
  - deploy

build-job:
  tags:
    - benchman
  stage: build
  script:
    - echo "Compiling the code..."
    - make build_freebsd
    - echo "Installation completed"
  artifacts:
    paths:
     - bin/freebsd/inact

deploy-job:
  tags:
    - benchman
  stage: deploy
  script:
    - echo "Begin deploy!"
    - pwd
    - echo "CI_BUILDS_DIR  = $CI_BUILDS_DIR"
    - echo "CI_PROJECT_DIR = $CI_PROJECT_DIR"
    - tar -C $CI_PROJECT_DIR/bin/freebsd -czf $DEPLOY_DIR/inact_freebsd.tar.gz ./inact
    - echo "End deploy!"
